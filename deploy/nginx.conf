# ==============================================================================
# Configuración Nginx de Producción para EC2 — Batería de Riesgo Psicosocial
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Permitir subida de lotes pesados (hasta 1000 PDFs o archivos .zip de 2GB)
    client_max_body_size 2048M;
    client_body_buffer_size 128k;

    # Compresión gzip para estáticos y JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2;

    # Proxy hacia el contenedor FastAPI / Uvicorn en el puerto 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Cabeceras estándar de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # IMPORTANTE: Desactivar buffering para Server-Sent Events (SSE)
        # Permite que la barra de progreso del lote se actualice en tiempo real sin congelarse
        proxy_buffering off;
        proxy_cache off;

        # Tiempos de espera extendidos para subidas masivas y procesamiento prolongado
        proxy_connect_timeout 600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    # Endpoint de comprobación de salud para AWS Application Load Balancer (ALB)
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
