services:
  db:
    image: postgres:16-alpine
    container_name: bateria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bateria_sst}
      POSTGRES_USER: ${DB_USER:-bateria_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ClaveSeguraSST2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bateria_admin} -d ${DB_NAME:-bateria_sst}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bateria-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bateria-psicosocial-omr:latest
    container_name: bateria_psicosocial
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8001}:8000"
    environment:
      # Base de Datos PostgreSQL
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-bateria_admin}:${DB_PASSWORD:-ClaveSeguraSST2026!}@db:5432/${DB_NAME:-bateria_sst}
      - DATABASE_URL_SYNC=postgresql://${DB_USER:-bateria_admin}:${DB_PASSWORD:-ClaveSeguraSST2026!}@db:5432/${DB_NAME:-bateria_sst}
      # JWT & Autenticación
      - JWT_SECRET=${JWT_SECRET:-SST_SecretKey_Resolucion2764_2026_Colombia}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      # Concurrencia de hilos de procesamiento paralelo
      - WORKERS=4
      - BATCH_MAX_WORKERS=4
      # Motor OCR 100% Self-Hosted
      - OCR_ENGINE=rapidocr
      - USE_AWS_TEXTRACT=0
      - OMP_NUM_THREADS=2
      - ONNXRUNTIME_NUM_THREADS=2
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./out:/app/out
      - ./src:/app/src
      - ./app:/app/app
      - ./tests:/app/tests
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: bateria_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://bateria-app:8000
    depends_on:
      - bateria-app

volumes:
  postgres_data:
    driver: local
